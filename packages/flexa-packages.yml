method: searched
source: https://docs.flexa.co/introduction
note: >-
  Flexa's first-party SDKs are the prebuilt "Flexa Components" wallet UI
  libraries for iOS, Android, and React Native. They are client-side embed
  libraries (see components/flexa-components.yml) distributed via standard
  package registries.
packages:
- language: javascript
  registry: npm
  name: "@flexa/flexa-react-native"
  version: 1.0.17
