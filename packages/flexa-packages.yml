  install: npm install @flexa/flexa-react-native
  repo: https://github.com/flexa/flexa-react-native
  official: true
- language: swift
  registry: swift-package-manager
  name: flexa-ios
  url: https://github.com/flexa/flexa-ios
  install: "Add https://github.com/flexa/flexa-ios via Swift Package Manager"
  repo: https://github.com/flexa/flexa-ios
  official: true
- language: kotlin
  registry: maven-central
  name: co.flexa:core
  version: 1.1.3
  url: https://central.sonatype.com/artifact/co.flexa/core
  install: "implementation 'co.flexa:core:1.1.3'"
  repo: https://github.com/flexa/flexa-android
  official: true
- language: kotlin
  registry: maven-central
