- aid: flexa:flexa-refunds-api
  name: Flexa Refunds API
  description: >-
    Refunds are the only way by which a Flexa payment can be reversed. Refunds are always initiated by
    the recipient, and can be made for either a partial amount or the full value of the original payment.


    Because Flexa supports payments using a wide variety of assets, including some that are highly price-volatile,
    refunds are always processed using current exchange rates. For example, if a customer makes a payment
    using bitcoin, and the commerce intent wasn’t denominated in bitcoin, the customer may not receive
    a refund for the exact same amount of bitcoin that they originally paid. Instead, the payment amount
    will be converted back into bitcoin using the market exchange rate before it’s refunded.
  humanURL: https://docs.flexa.co/introduction
  baseURL: https://api.flexa.co
