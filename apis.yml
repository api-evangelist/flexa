aid: flexa
name: Flexa
description: >-
  Flexa is a digital-currency payments network that lets businesses accept
  crypto and other digital assets from customers anywhere, with instant
  authorization, fraud-resistant settlement, and automatic conversion into a
  preferred payout currency so merchants avoid price volatility. The Flexa
  Payments API is built around the "commerce intent" resource, which represents
  any attempt to collect a digital-currency payment and tracks requested debits
  against actual credits; supporting resources include assets, refunds, events,
  links, brands, and flexcodes. Flexa ships prebuilt mobile UI Components for
  iOS, Android, and React Native, plus in-person (Point of Sale) and online
  acceptance options, and a production-grade test mode that uses a valueless
  ERC-20 "Credit" (CR) token. Flexa is backed by Pantera Capital and supports
  99+ digital assets across Ethereum, Bitcoin, Lightning, Solana, and more.
