apis:
- aid: flexa:flexa-assets-api
  name: Flexa Assets API
  description: >-
    Assets encompass all the value that flows through the Flexa platform. In the Flexa API, both national
    currencies (“fiat“) and digital currencies (“crypto“ or “digital assets“) are returned together in
    one collection.


    The Flexa API uses [CAIP](https://chainagnostic.org/CAIPs/caip-19)-style IDs for all assets. National
    currency asset IDs are all prefixed with “iso4217/” and use [ISO 4217](https://en.wikipedia.org/wiki/ISO_4217)
    3-digit alphabetic codes. For example, ether on Ethereum mainnet is `eip155:1/slip44:60`, and the
    Canadian dollar is `iso4217/CAD`.
  humanURL: https://docs.flexa.co/introduction
  baseURL: https://api.flexa.co
